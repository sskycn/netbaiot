[workspace]
members = ["apps/netbaiot-server", "apps/netbaiot-cli", "crates/*", "tools/netbaiot-loadgen"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
url = "2"
netbaiot-protocol = { path = "crates/netbaiot-protocol" }
netbaiot-core = { path = "crates/netbaiot-core" }
netbaiot-client = { path = "crates/netbaiot-client" }
netbaiot-device-sdk = { path = "crates/netbaiot-device-sdk" }
netbaiot-mqtt-wire = { path = "crates/netbaiot-mqtt-wire" }
netbaiot-runtime = { path = "crates/netbaiot-runtime" }
netbaiot-codecs = { path = "crates/netbaiot-codecs" }
netbaiot-transports = { path = "crates/netbaiot-transports" }
netbaiot-v3-mux = { path = "crates/netbaiot-v3-mux" }
async-trait = "0.1"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-core = "0.3"
futures-util = "0.3"
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "netbaiot-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
serde_json = "1"
sha2 = "0.10"
netbaiot-core = { path = "../crates/netbaiot-core" }
netbaiot-codecs = { path = "../crates/netbaiot-codecs" }
netbaiot-runtime = { path = "../crates/netbaiot-runtime" }
netbaiot-transports = { path = "../crates/netbaiot-transports" }

[workspace]
members = ["."]

[[bin]]
name = "mqtt_fixed_header"
path = "fuzz_targets/mqtt_fixed_header.rs"
test = false
doc = false
bench = false


[package]
name = "netbaiot-server"
default-run = "netbaiot-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schemars = { workspace = true, optional = true }
serde_path_to_error = "0.1"
netbaiot-core.workspace = true
netbaiot-runtime.workspace = true
netbaiot-codecs.workspace = true
netbaiot-transports.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
reqwest.workspace = true
sha2.workspace = true

[lints]
workspace = true

[dev-dependencies]
hmac.workspace = true
uuid.workspace = true
netbaiot-client.workspace = true
netbaiot-device-sdk.workspace = true
netbaiot-protocol.workspace = true
futures-util.workspace = true
jsonwebtoken = "9.3.1"
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }

[features]
schema = ["dep:schemars", "netbaiot-runtime/schema", "netbaiot-transports/schema"]

[[bin]]
name = "netbaiot-schema"
path = "src/bin/schema.rs"
required-features = ["schema"]

[package]
name = "netbaiot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "netbaiot"
path = "src/main.rs"

[dependencies]
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
x509-parser = { version = "0.18", default-features = false }
reqwest.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
rustls-pemfile.workspace = true

clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
netbaiot-server = { path = "../netbaiot-server" }
netbaiot-device-sdk.workspace = true
netbaiot-runtime.workspace = true
tokio-util.workspace = true
uuid.workspace = true
tempfile = "3"
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true

netbaiot-client.workspace = true
netbaiot-protocol.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }

name: Release verification

on:
  workflow_call:
    inputs:
      release-tag:
        description: Exact release tag; empty checks the current workspace version
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Schema drift and release preflight
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: cargo xtask check release --part preflight

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: rustc --version --verbose
      - run: cargo --version --verbose
      - name: Run workspace checks
        run: >-
          python3 scripts/ci_annotate.py
          --title "Rust workspace checks failed"
          -- cargo xtask check release --part rust

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: cargo xtask check release --part audit

  mqtt:
    uses: ./.github/workflows/mqtt-interop.yml

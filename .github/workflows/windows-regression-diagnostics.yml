name: Windows recovery state diagnostics
on:
  push:
    branches: [codex/windows-recovery-regression]
    paths: [.github/workflows/windows-regression-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Repeat with session and provider diagnostics
        shell: pwsh
        run: |
          python scripts/windows_regression_probe.py --commit diagnostic --repetitions 40
          $probeExit = $LASTEXITCODE
          python -c "import json,pathlib; logs=pathlib.Path('target/evidence/windows-regression'); names=['one_socket_authentication_progresses_while_event_ack_waits','v1_spooled_required_event_replays_to_v2_with_stable_event_id']; [(print('::notice title=state-diagnostic::'+json.dumps({'test':name,'tail':next((p.read_text(encoding='utf-8',errors='replace')[-6500:] for p in logs.glob(name+'-*.log') if 'FAILED' in p.read_text(encoding='utf-8',errors='replace')),'no failures')}).replace('%','%25')) for name in names)]"
          exit $probeExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-state-diagnostics
          path: target/evidence/windows-regression/
          retention-days: 14

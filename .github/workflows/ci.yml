name: Rust checks
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/release-verify.yml

  archive-smoke:
    name: Linux binary Quick Start
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes mosquitto-clients
      - name: Package and execute the extracted archive
        run: cargo xtask check release --part archive

name: Rust checks
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/release-verify.yml

  archive-smoke:
    name: Linux binary Quick Start
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes mosquitto-clients
      - run: cargo build --locked --release -p netbaiot-server -p netbaiot-cli
      - name: Package and execute the extracted archive
        run: |
          tag="$(python3 -c 'import sys; sys.path.insert(0,"scripts"); from release_preflight import ROOT,workspace_version; print("v"+workspace_version(ROOT))')"
          python3 scripts/release_package.py package --tag "$tag" \
            --target x86_64-unknown-linux-gnu --build-dir target/release --dist dist
          python3 tests/release_archive_smoke.py "dist/netbaiot-${tag}-x86_64-unknown-linux-gnu.tar.gz"

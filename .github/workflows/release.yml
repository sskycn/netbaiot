name: GitHub Release
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Candidate version (vX.Y.Z); verifies Linux without publishing
        required: true
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.ref_name }}
jobs:
  verify:
    uses: ./.github/workflows/release-verify.yml
    with:
      release-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.ref_name }}
  linux:
    needs: verify
    uses: ./.github/workflows/linux-packages.yml
    with:
      release-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.ref_name }}
  publish:
    name: Publish official Linux Release
    if: github.event_name == 'push'
    needs: [verify, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-release-*
          path: dist
          merge-multiple: true
      - name: Verify exact assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_package.py verify-checksums --tag "$RELEASE_TAG" --dist dist
          python3 scripts/release_package.py assets --tag "$RELEASE_TAG" --dist dist > assets.txt
          mapfile -t files < assets.txt
          assets=()
          for file in "${files[@]}"; do assets+=("dist/$file"); done
          notes_file="docs/releases/${RELEASE_TAG}.md"
          test -s "$notes_file"
          args=(release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            --title "NetbaIoT $RELEASE_TAG" --notes-file "$notes_file" --verify-tag)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"

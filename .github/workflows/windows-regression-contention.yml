name: Windows recovery parallel contention diagnostics
on:
  push:
    branches: [codex/windows-recovery-regression]
    paths: [.github/workflows/windows-regression-contention.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parallel:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Match native recovery prelude
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p netbaiot-runtime spool::
          cargo test --locked -p netbaiot-transports mqtt_recovery
          cargo test --locked -p netbaiot-server --test server subprocess_
          cargo test --locked -p netbaiot-server --test server recovery_directory_is_exclusive
          cargo test --locked -p netbaiot-server --test server startup_failures_and_dropped_run_future
      - name: Repeat default parallel suite and capture the first failing state
        shell: python
        run: |
          import json, pathlib, subprocess, time
          root = pathlib.Path('target/evidence/windows-contention')
          root.mkdir(parents=True, exist_ok=True)
          samples = []
          count = 10
          while len(samples) < count:
              start = time.monotonic()
              p = subprocess.run(['cargo', 'test', '--locked', '-p', 'netbaiot-server', '--test', 'business_rpc_v2'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace')
              (root / f'parallel-{len(samples)+1}.log').write_text(p.stdout, encoding='utf-8')
              sample = {'pass': p.returncode == 0, 'duration_s': round(time.monotonic()-start,3)}
              samples.append(sample)
              print(json.dumps({'iteration':len(samples), **sample}), flush=True)
              if p.returncode and count == 10:
                  count = 40
                  print('::notice title=parallel-state::'+json.dumps({'tail':p.stdout[-12000:]}).replace('%','%25'), flush=True)
          result = {'pass':sum(s['pass'] for s in samples), 'fail':sum(not s['pass'] for s in samples), 'samples':samples}
          (root / 'results.json').write_text(json.dumps(result,indent=2), encoding='utf-8')
          print('::notice title=parallel-repetitions::'+json.dumps(result), flush=True)
          raise SystemExit(int(result['fail'] != 0))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-parallel-contention
          path: target/evidence/windows-contention/
          retention-days: 14

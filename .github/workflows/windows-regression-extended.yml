name: Windows recovery extended state comparison
on:
  push:
    branches: [codex/windows-recovery-regression]
    paths: [.github/workflows/windows-regression-extended.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended:
    strategy:
      fail-fast: false
      matrix:
        commit:
          - a91a9103f13a32058c35c177bb4765026c277040
          - 5d612af1e6f7530078e6819fa2114a8fa524b61f
          - 7b4e3c47c909cd24a8a381eb377d6ef38905c143
          - 302912c59fbebfc27eabf8c653b0ab3620bde658
          - 1bd5cf8e15293bbed0ea8f80929f5405cf5a2751
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          path: source
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Add output-only state diagnostics to the historical implementation
        shell: pwsh
        run: python probe/scripts/instrument_windows_sessions.py probe source
      - name: Repeat each target fifty times with the workspace feature profile
        working-directory: source
        shell: pwsh
        run: |
          python ../probe/scripts/windows_regression_probe.py --commit ${{ matrix.commit }} --all-features --repetitions 50 --failure-repetitions 50 --skip-suites
          $probeExit = $LASTEXITCODE
          python -c "import json,pathlib; root=pathlib.Path('target/evidence/windows-regression'); names=['one_socket_authentication_progresses_while_event_ack_waits','v1_spooled_required_event_replays_to_v2_with_stable_event_id']; [(print('::notice title=extended-state::'+json.dumps({'test':name,'tail':next((p.read_text(encoding='utf-8',errors='replace')[-10000:] for p in root.glob(name+'-*.log') if 'FAILED' in p.read_text(encoding='utf-8',errors='replace')),'no failures')}).replace('%','%25')) for name in names)]"
          exit $probeExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-${{ matrix.commit }}
          path: source/target/evidence/windows-regression/
          retention-days: 14

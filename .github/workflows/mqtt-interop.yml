name: MQTT external interoperability

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test-only Mosquitto tools
        run: sudo apt-get update && sudo apt-get install --yes mosquitto mosquitto-clients
      - name: Show external tool versions
        run: |
          mosquitto -h 2>&1 | head -1
          mosquitto_pub --help 2>&1 | head -2
          mosquitto_sub --help 2>&1 | head -2
      - name: Run complete MQTT and Device SDK gates
        run: >-
          python3 scripts/ci_annotate.py
          --title "MQTT release gate failed"
          -- cargo xtask check release --part mqtt
      - name: Retain protocol regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-protocol-regressions
          path: target/mqtt-audit/ci.json
          if-no-files-found: warn
      - name: Retain release and reference timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-release-gate
          path: target/mqtt-conformance/results.json
          if-no-files-found: warn

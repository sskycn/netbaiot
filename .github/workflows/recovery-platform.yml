name: Native recovery and lifecycle
on:
  pull_request:
  push:
    branches: [main, codex/strict-reliability-audit, codex/windows-recovery-regression]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Native recovery and shutdown paths before unrelated workspace tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p netbaiot-runtime spool:: 2>&1 | tee native-recovery.log
          cargo test --locked -p netbaiot-transports mqtt_recovery 2>&1 | tee -a native-recovery.log
          cargo test --locked -p netbaiot-server --test server subprocess_ 2>&1 | tee -a native-recovery.log
          cargo test --locked -p netbaiot-server --test server recovery_directory_is_exclusive 2>&1 | tee -a native-recovery.log
          cargo test --locked -p netbaiot-server --test server startup_failures_and_dropped_run_future 2>&1 | tee -a native-recovery.log
      - name: Native workspace regressions including subprocess recovery
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features 2>&1 | tee -a native-recovery.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-recovery-${{ matrix.os }}-${{ github.sha }}
          path: |
            native-recovery.log
            target/performance/
            target/evidence/
          if-no-files-found: warn
          retention-days: 14

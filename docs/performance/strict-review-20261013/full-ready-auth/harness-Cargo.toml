[package]
name="netbaiot-auth-deadline-audit"
version="0.0.0"
edition="2024"

[dependencies]
netbaiot-core={path="<repo>/crates/netbaiot-core"}
netbaiot-runtime={path="<repo>/crates/netbaiot-runtime"}
netbaiot-codecs={path="<repo>/crates/netbaiot-codecs"}
netbaiot-transports={path="<repo>/crates/netbaiot-transports"}
async-trait="0.1"
tokio={version="1",features=["full","test-util"]}
tokio-util={version="0.7",features=["rt"]}
uuid={version="1",features=["v4","serde"]}
serde_json="1"
bytes="1"

[features]
baseline=[]
